      position: relative;

      height: 100vh;
      height: 100dvh;
      min-height: 500px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
    }
    .design-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="design-container">

      allowfullscreen
      allow="fullscreen">
    </iframe>
  </div>
  <script>
